name: Daily Empty Commits

on:
  schedule:
    # Monday (7 commits)
    - cron: "12 1 * * 1"
    - cron: "43 3 * * 1"
    - cron: "18 6 * * 1"
    - cron: "55 9 * * 1"
    - cron: "27 12 * * 1"
    - cron: "41 16 * * 1"
    - cron: "08 20 * * 1"

    # Tuesday (6 commits)
    - cron: "25 2 * * 2"
    - cron: "11 5 * * 2"
    - cron: "49 8 * * 2"
    - cron: "34 11 * * 2"
    - cron: "57 15 * * 2"
    - cron: "22 19 * * 2"

    # Wednesday (8 commits)
    - cron: "07 0 * * 3"
    - cron: "38 2 * * 3"
    - cron: "16 5 * * 3"
    - cron: "52 7 * * 3"
    - cron: "29 10 * * 3"
    - cron: "45 13 * * 3"
    - cron: "18 17 * * 3"
    - cron: "54 21 * * 3"

    # Thursday (5 commits)
    - cron: "14 1 * * 4"
    - cron: "37 6 * * 4"
    - cron: "58 10 * * 4"
    - cron: "23 15 * * 4"
    - cron: "46 19 * * 4"

    # Friday (9 commits)
    - cron: "09 0 * * 5"
    - cron: "31 2 * * 5"
    - cron: "55 4 * * 5"
    - cron: "20 7 * * 5"
    - cron: "47 9 * * 5"
    - cron: "13 12 * * 5"
    - cron: "39 14 * * 5"
    - cron: "06 18 * * 5"
    - cron: "51 22 * * 5"

    # Saturday (6 commits)
    - cron: "28 1 * * 6"
    - cron: "44 5 * * 6"
    - cron: "17 8 * * 6"
    - cron: "53 11 * * 6"
    - cron: "36 16 * * 6"
    - cron: "10 20 * * 6"

    # Sunday (7 commits)
    - cron: "15 0 * * 0"
    - cron: "42 3 * * 0"
    - cron: "24 6 * * 0"
    - cron: "59 9 * * 0"
    - cron: "33 13 * * 0"
    - cron: "48 17 * * 0"
    - cron: "21 21 * * 0"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create empty commit
        run: |
          git commit --allow-empty -m "chore: daily activity $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
