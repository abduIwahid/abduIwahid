name: Daily Empty Commits

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 6 * * *"
    - cron: "0 10 * * *"
    - cron: "0 14 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Random empty commit
        run: |
          if [ $((RANDOM % 2)) -eq 1 ]; then
            git commit --allow-empty -m "chore: daily activity $(date -u)"
            git push
          else
            echo "Skipping this run."
          fi
