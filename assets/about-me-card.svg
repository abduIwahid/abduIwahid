<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#151515" />
            <stop offset="100%" stop-color="#0a0a0a" />
        </linearGradient>
        <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#333333" />
            <stop offset="100%" stop-color="#111111" />
        </linearGradient>
        <style>
            .card {
                fill: url(#bg);
                stroke: url(#glow);
                stroke-width: 1.5;
                rx: 12;
            }
            .header-bg {
                fill: #1e1e1e;
            }
            .title {
                font-family: 'Segoe UI', Ubuntu, sans-serif;
                font-weight: 700;
                font-size: 28px;
                fill: #ffffff;
                opacity: 0;
                animation: fadeIn 0.8s ease forwards;
            }
            .subtitle {
                font-family: 'Segoe UI', Ubuntu, sans-serif;
                font-weight: 600;
                font-size: 13px;
                fill: #888888;
            }
            .text {
                font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
                font-size: 15px;
                fill: #abb2bf;
                opacity: 0;
            }
            
            /* Syntax Highlighting (One Dark theme) */
            .keyword { fill: #c678dd; }
            .string { fill: #98c379; }
            .variable { fill: #e06c75; }
            .function { fill: #61afef; }
            .operator { fill: #56b6c2; }
            
            /* Staggered text fade in animations */
            .line-1 { animation: fadeIn 0.6s ease forwards 0.2s; }
            .line-2 { animation: fadeIn 0.6s ease forwards 0.4s; }
            .line-3 { animation: fadeIn 0.6s ease forwards 0.6s; }
            .line-4 { animation: fadeIn 0.6s ease forwards 0.8s; }
            .line-5 { animation: fadeIn 0.6s ease forwards 1.0s; }
            .line-6 { animation: fadeIn 0.6s ease forwards 1.2s; }
            .line-7 { animation: fadeIn 0.6s ease forwards 1.4s; }
            .line-8 { animation: fadeIn 0.6s ease forwards 1.6s; }
            
            @keyframes fadeIn {
                from { opacity: 0; transform: translateX(-5px); }
                to { opacity: 1; transform: translateX(0); }
            }
            
            /* Floating container */
            .floating {
                animation: float 6s ease-in-out infinite;
                transform-origin: center;
            }
            
            @keyframes float {
                0% { transform: translateY(0px); }
                50% { transform: translateY(-8px); }
                100% { transform: translateY(0px); }
            }
        </style>
    </defs>

    <g class="floating">
        <!-- Main Card Window -->
        <rect class="card" x="15" y="15" width="770" height="315" />
        
        <!-- Window Header (Mac Style) -->
        <path class="header-bg" d="M 15 27 Q 15 15 27 15 L 773 15 Q 785 15 785 27 L 785 45 L 15 45 Z" />
        
        <circle cx="45" cy="30" r="6" fill="#ff5f56" />
        <circle cx="65" cy="30" r="6" fill="#ffbd2e" />
        <circle cx="85" cy="30" r="6" fill="#27c93f" />
        
        <text x="400" y="34" class="subtitle" style="text-anchor: middle;">abdulwahid.py — VS Code</text>
        
        <!-- Line numbers -->
        <g fill="#4b5263" font-family="'Consolas', monospace" font-size="15px">
            <text x="35" y="85">1</text>
            <text x="35" y="115">2</text>
            <text x="35" y="145">3</text>
            <text x="35" y="175">4</text>
            <text x="35" y="205">5</text>
            <text x="35" y="235">6</text>
            <text x="35" y="265">7</text>
            <text x="35" y="295">8</text>
        </g>
        
        <!-- Code Content -->
        <text x="75" y="85" class="text line-1">
            <tspan class="keyword">class</tspan> <tspan class="function">AbdulWahid</tspan><tspan class="operator">:</tspan>
        </text>
        
        <text x="105" y="115" class="text line-2">
            <tspan class="keyword">def</tspan> <tspan class="function">__init__</tspan>(<tspan class="variable">self</tspan>)<tspan class="operator">:</tspan>
        </text>
        
        <text x="135" y="145" class="text line-3">
            self.<tspan class="variable">name</tspan>        <tspan class="operator">=</tspan> <tspan class="string">"Abdul Wahid"</tspan>
        </text>
        
        <text x="135" y="175" class="text line-4">
            self.<tspan class="variable">role</tspan>        <tspan class="operator">=</tspan> <tspan class="string">"AI / ML Developer"</tspan>
        </text>
        
        <text x="135" y="205" class="text line-5">
            self.<tspan class="variable">education</tspan>   <tspan class="operator">=</tspan> <tspan class="string">"BS Artificial Intelligence @ COMSATS"</tspan>
        </text>
        
        <text x="135" y="235" class="text line-6">
            self.<tspan class="variable">location</tspan>    <tspan class="operator">=</tspan> <tspan class="string">"Pakistan 🇵🇰"</tspan>
        </text>
        
        <text x="135" y="265" class="text line-7">
            self.<tspan class="variable">focus</tspan>       <tspan class="operator">=</tspan> [<tspan class="string">"Machine Learning"</tspan>, <tspan class="string">"Deep Learning"</tspan>, <tspan class="string">"MLOps"</tspan>]
        </text>
        
        <text x="135" y="295" class="text line-8">
            self.<tspan class="variable">status</tspan>      <tspan class="operator">=</tspan> <tspan class="string">"Open to exciting opportunities! 🚀"</tspan>
        </text>
    </g>
</svg>
