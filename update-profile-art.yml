name: Update profile art

# Regenerates contrib-heatmap.svg, stats.svg and wadi-ascii.svg daily
# from real GitHub data (generators live in scripts/).

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Regenerate profile SVGs
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/render_stats_svg.py
          python scripts/make_ascii_svg.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg stats.svg wadi-ascii.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile art"
          git push
